<!DOCTYPE html>
<html>

<head>
    <title>School Task Manager</title>
</head>

<body>

    <h1>School Task Manager</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Add Task</button>

    </form>

    <hr>

    {% for task in tasks %}

        <div>
            <h2>{{ task.title }}</h2>

            <p>{{ task.description }}</p>

            <p>Priority: {{ task.priority }}</p>

            {% if task.completed %}
                <p>Status: Completed</p>
            {% else %}
                <p>Status: Pending</p>
            {% endif %}
        </div>

        <hr>

    {% empty %}

        <p>No tasks available.</p>

    {% endfor %}

</body>

</html>
